apiVersion: v1
kind: Service
metadata:
  name: {{ include "containerd-registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "containerd-registry.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "containerd-registry.selectorLabels" . | nindent 4 }}
  # A client talks to the containerd of its own node, where pulled images are
  # also what its kubelet uses.
  internalTrafficPolicy: Local
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
